<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>わたしのタスク</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header><span class="eyebrow">MY TASKS</span><h1>わたしのタスク</h1><p>ひとつずつ、今日できることから。</p></header>
  <section class="card" aria-label="タスク管理">
    <form id="add-form"><label for="task-input">新しいタスク</label><div class="input-row"><input id="task-input" maxlength="200" placeholder="何をしますか？" required autocomplete="off"><button id="submit-task" class="primary" type="submit">追加する</button></div>
      <details id="details"><summary>期限・優先度・進捗・メモ</summary>
        <div class="detail-grid">
          <label>期限<input id="task-due" type="date" min="0001-01-01" max="9999-12-31"></label>
          <label>優先度<select id="task-priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></label>
          <label>進捗（%）<input id="task-progress" type="number" min="0" max="100" step="1" value="0" required></label>
        </div>
        <label>メモ（補足）<textarea id="task-memo" maxlength="5000" rows="3" placeholder="進め方や気になることなど"></textarea></label>
        <p class="hint">進捗100%で完了になります。チェックを外すと0%に戻ります。</p>
      </details><button id="cancel-edit" type="button" hidden>編集をキャンセル</button>
    </form>
    <div class="toolbar"><div class="filters" role="group" aria-label="表示するタスク"><button data-filter="all" aria-pressed="true">すべて</button><button data-filter="active" aria-pressed="false">未完了</button><button data-filter="done" aria-pressed="false">完了</button></div><span id="count"></span></div>
    <ul id="tasks" aria-label="タスク一覧"></ul><p id="empty">まだタスクはありません。<br>小さなことから追加してみましょう。</p>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section class="backup" aria-label="バックアップ"><button id="export">バックアップを保存</button><label class="import-label">バックアップから復元<input id="import" type="file" accept="application/json,.json"></label><p class="hint">復元はタスクを追加します。同じIDのタスクは上書きしません。</p></section>
  <footer>タスクはこのブラウザに保存されます。<br>別の端末との同期はありません。</footer>
</main><script type="module" src="app.js"></script>
</body></html>
